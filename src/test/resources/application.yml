spring:
  datasource:
    url: jdbc:h2:mem:notification-platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  security:
    jwt:
      secret: "CHANGE_ME_TO_LONG_RANDOM_SECRET_32+_CHARS"
      ttl-minutes: 120
