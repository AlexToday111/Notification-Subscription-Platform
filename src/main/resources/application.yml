management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans


app:
  name: ${APP_NAME:notification-platform}
  version: ${APP_VERSION:dev}
  outbox:
    publisher-delay-ms: ${APP_OUTBOX_PUBLISHER_DELAY_MS:1000}
  channels:
    email:
      from: ${APP_EMAIL_FROM:no-reply@notification-platform.local}
    telegram:
      base-url: ${APP_TELEGRAM_BASE_URL:https://api.telegram.org}
      bot-token: ${APP_TELEGRAM_BOT_TOKEN:}
    webhook:
      secret: ${APP_WEBHOOK_SECRET:local-webhook-secret}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:CHANGE_ME_TO_LONG_RANDOM_SECRET_32+_CHARS}
      ttl-minutes: ${APP_JWT_TTL_MINUTES:120}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${SPRING_DATASOURCE_USERNAME:notification}
    password: ${SPRING_DATASOURCE_PASSWORD:notification}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    template:
      observation-enabled: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 5
        default-requeue-rejected: false
        observation-enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

logging:
  file:
    name: ${LOG_FILE:logs/notification-platform.json}
